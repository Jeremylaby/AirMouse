name: Setup mobile
description: Set up Node from .tool-versions and install mobile/ dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: mobile/package-lock.json

    - run: npm ci
      shell: bash
      working-directory: mobile
