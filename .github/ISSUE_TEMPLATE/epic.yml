name: Epic
description: A bigger piece of work split into tickets
labels: ["Epic", "mobile"]
projects: ["Jeremylaby/2"]
body:
  - type: markdown
    attributes:
      value: After creating the epic, connect its tickets with "Create sub-issue" or "Add existing issue".
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: What we want to do and why. Add useful links (technical/UI designs, research results).
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Only the non-obvious stuff. Can be left blank.
    validations:
      required: false
